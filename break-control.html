<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Break-Steuerung</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d19;color:#eef5ff;font-family:Arial,sans-serif;padding:24px}
main{max-width:620px;margin:30px auto;background:#111b2d;border:1px solid #263d60;border-radius:20px;padding:26px;box-shadow:0 0 28px #071c3c}
h1{margin-top:0;color:#8ecbff;text-shadow:0 0 14px #168bff}label{display:block;margin:18px 0 8px;color:#b8c9e2}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #355477;background:#081222;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}
.primary{background:linear-gradient(100deg,#ff2747,#247cff);color:white;box-shadow:0 0 16px #164b9b}
.secondary{background:#243650;color:white}.status{margin:16px 0;color:#9fb6d6;min-height:22px}
.hidden{display:none}.note{font-size:13px;color:#91a3bd;line-height:1.5}
</style></head><body><main>
<h1>BREAK – Steuerung</h1>
<section id="login">
<p>Bitte mit deinem bestehenden Scoreboard-Login anmelden.</p>
<label>E-Mail</label><input id="email" type="email" autocomplete="username">
<label>Passwort</label><input id="password" type="password" autocomplete="current-password">
<button class="primary" id="loginBtn">Anmelden</button>
</section>
<section id="panel" class="hidden">
<div class="status" id="authStatus">Angemeldet</div>
<label>Text unter BREAK</label><input id="message" value="Gleich geht’s weiter!">
<button class="primary" id="saveBtn">Text übernehmen</button>
<hr style="border-color:#263d60;margin:24px 0">
<button class="primary" id="showBtn">BREAK EINBLENDEN</button>
<button class="secondary" id="hideBtn">BREAK AUSBLENDEN</button><br>
<button class="primary" id="musicOn">MUSIK STARTEN</button>
<button class="secondary" id="musicOff">MUSIK STOPPEN</button>
<p class="note">Tipp: Wenn PRISM die Musik nicht automatisch abspielt, prüfe bei der Browserquelle die Autoplay-/Audio-Einstellungen.</p>
<button class="secondary" id="logoutBtn">Abmelden</button>
</section>
<div class="status" id="status"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDhYBRhGo3jlKSjullTBQaprgaoSPA7dXk",
  authDomain: "badminton-scoreboard-5c4b4.firebaseapp.com",
  databaseURL: "https://badminton-scoreboard-5c4b4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "badminton-scoreboard-5c4b4",
  storageBucket: "badminton-scoreboard-5c4b4.firebasestorage.app",
  messagingSenderId: "257689447899",
  appId: "1:257689447899:web:37fd7d47ff7c5e0eae4bfe"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.database();
const allowedUID = "NWl3lBL8XEZBiQKniVsIXiKsHB73";
const ref = db.ref("matches/badminton1/breakOverlay");
const $ = id => document.getElementById(id);
function say(t) { $("status").textContent=t; }
auth.onAuthStateChanged(user => {
  if (user && user.uid === allowedUID) {
    $("login").classList.add("hidden"); $("panel").classList.remove("hidden");
    $("authStatus").textContent = "Angemeldet als " + user.email;
    ref.once("value").then(s => { const v=s.val()||{}; $("message").value=v.message||"Gleich geht’s weiter!"; });
  } else {
    $("login").classList.remove("hidden"); $("panel").classList.add("hidden");
    if (user) { auth.signOut(); say("Dieses Konto ist nicht für die Steuerung freigeschaltet."); }
  }
});
$("loginBtn").onclick = () => auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value).catch(e=>say("Anmeldung fehlgeschlagen: "+e.message));
$("saveBtn").onclick = () => ref.update({message:$("message").value.trim()||"Gleich geht’s weiter!"}).then(()=>say("Text übernommen."));
$("showBtn").onclick = () => ref.update({active:true}).then(()=>say("BREAK wird eingeblendet."));
$("hideBtn").onclick = () => ref.update({active:false,music:false}).then(()=>say("BREAK ausgeblendet und Musik gestoppt."));
$("musicOn").onclick = () => ref.update({music:true}).then(()=>say("Musikstart gesendet."));
$("musicOff").onclick = () => ref.update({music:false}).then(()=>say("Musik gestoppt."));
$("logoutBtn").onclick = () => auth.signOut();
</script></body></html>
