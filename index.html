
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badminton Spielstand</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
}
#display {
  background: transparent;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  min-height: 100vh;
  font-size: clamp(60px, 12vw, 110px);
  font-weight: 900;
  text-shadow: 0 2px 8px #000;
}
#control {
  display: none;
  min-height: 100vh;
  background: #101827;
  color: white;
  padding: 25px;
  text-align: center;
}
#control h1 { font-size: 25px; }
.teams {
  display: flex;
  justify-content: space-around;
  gap: 15px;
}
.team { flex: 1; }
.score {
  font-size: 65px;
  font-weight: bold;
  margin: 18px 0;
}
button {
  border: 0;
  border-radius: 14px;
  padding: 15px 25px;
  font-size: 28px;
  font-weight: bold;
  margin: 5px;
}
.plus { background: #168cff; color: white; }
.minus { background: #303d50; color: white; }
.reset {
  margin-top: 35px;
  font-size: 16px;
  background: #303d50;
  color: white;
}
#status { font-size: 13px; color: #aab6c8; }
</style>
</head>
<body>

<div id="display">
  <span id="homeDisplay">0</span>
  <span>:</span>
  <span id="guestDisplay">0</span>
</div>

<div id="control">
  <h1>Spielstand steuern</h1>
  <div class="teams">
    <div class="team">
      <h3>Heim</h3>
      <div class="score" id="homeControl">0</div>
      <button class="minus" onclick="changeScore('home',-1)">−</button>
      <button class="plus" onclick="changeScore('home',1)">+</button>
    </div>
    <div class="team">
      <h3>Gast</h3>
      <div class="score" id="guestControl">0</div>
      <button class="minus" onclick="changeScore('guest',-1)">−</button>
      <button class="plus" onclick="changeScore('guest',1)">+</button>
    </div>
  </div>
  <button class="reset" onclick="resetScore()">Spielstand zurücksetzen</button>
  <p id="status">Verbinde ...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// HIER SPÄTER DEINE FIREBASE-DATEN EINTRAGEN
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "DEIN_PROJEKT.firebaseapp.com",
  databaseURL: "DEINE_DATABASE_URL",
  projectId: "DEIN_PROJEKT",
  appId: "DEINE_APP_ID"
};

const isControl = new URLSearchParams(location.search).get("control") === "1";

if (isControl) {
  document.getElementById("display").style.display = "none";
  document.getElementById("control").style.display = "block";
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const scoreRef = db.ref("matches/badminton1");

auth.signInAnonymously().then(() => {
  document.getElementById("status").textContent = "Verbunden";

  scoreRef.once("value").then(snapshot => {
    if (!snapshot.exists()) {
      scoreRef.set({home: 0, guest: 0});
    }
  });

  scoreRef.on("value", snapshot => {
    const score = snapshot.val() || {home: 0, guest: 0};

    document.getElementById("homeDisplay").textContent = score.home ?? 0;
    document.getElementById("guestDisplay").textContent = score.guest ?? 0;
    document.getElementById("homeControl").textContent = score.home ?? 0;
    document.getElementById("guestControl").textContent = score.guest ?? 0;
  });
}).catch(error => {
  document.getElementById("status").textContent =
    "Verbindungsfehler: " + error.message;
});

function changeScore(team, amount) {
  scoreRef.child(team).transaction(current =>
    Math.max(0, (current || 0) + amount)
  );
}

function resetScore() {
  if (confirm("Spielstand wirklich zurücksetzen?")) {
    scoreRef.set({home: 0, guest: 0});
  }
}
</script>
</body>
</html>
