<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG Brietlingen-Adendorf – Live-Spielstand</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; }
body { background: transparent; }

/* Öffentliche Anzeige für PRISM */
#display {
  position: relative;
  width: 100vw;
  max-width: 100%;
  margin: 0 auto;
  line-height: 0;
  background: transparent;
}
#overlayArt { display: block; width: 100%; height: auto; }
.score-number {
  position: absolute;
  top: 50.7%;
  transform: translate(-50%, -50%);
  width: 6.2%;
  text-align: center;
  color: #102033;
  font-size: clamp(18px, 4.5vw, 76px);
  line-height: 1;
  font-weight: 900;
  font-family: Arial, sans-serif;
  text-shadow: 0 1px 1px rgba(255,255,255,.45);
  font-variant-numeric: tabular-nums;
}
#homeDisplay { left: 38.3%; }
#guestDisplay { left: 55.0%; }

/* Steuerungsseite */
#control { display: none; min-height: 100vh; background: #101827; color: #fff; padding: 24px 16px; text-align: center; }
#login, #controlPanel { max-width: 520px; margin: 42px auto; }
#login input { display: block; width: 100%; padding: 16px; margin: 14px 0; border-radius: 12px; border: 1px solid #526176; font-size: 17px; }
button { border: 0; border-radius: 14px; padding: 15px 24px; font-size: 22px; font-weight: bold; margin: 5px; cursor: pointer; }
#login button, .plus { background: #168cff; color: white; }
.minus, .reset, .logout { background: #303d50; color: white; }
#login button { width: 100%; font-size: 18px; }
#controlPanel { display: none; }
#control h1 { font-size: 28px; }
.teams { display: flex; justify-content: space-around; gap: 14px; }
.team { flex: 1; min-width: 0; }
.score { font-size: 64px; font-weight: bold; margin: 18px 0; }
.team button { min-width: 64px; }
.reset { margin-top: 30px; font-size: 16px; }
.logout { margin-top: 14px; font-size: 15px; }
#status { font-size: 14px; color: #aab6c8; }
#error { color: #ff7777; font-size: 14px; overflow-wrap: anywhere; }
@media (max-width: 420px) {
  #control { padding: 20px 10px; }
  .score { font-size: 54px; }
  .team button { min-width: 54px; padding: 13px 18px; }
}
</style>
</head>
<body>

<div id="display" aria-label="Live-Spielstand SG Brietlingen-Adendorf gegen BSG Wallhöfen/Ihlpohl">
  <img id="overlayArt" src="assets/scoreboard-overlay.png" alt="SG Brietlingen-Adendorf gegen BSG Wallhöfen/Ihlpohl – Live">
  <span class="score-number" id="homeDisplay">0</span>
  <span class="score-number" id="guestDisplay">0</span>
</div>

<div id="control">
  <div id="login">
    <h1>Scoreboard Login</h1>
    <p>Bitte melde dich an, um den Spielstand zu steuern.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="E-Mail-Adresse" autocomplete="username" required>
      <input id="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
    </form>
    <p id="error"></p>
  </div>

  <div id="controlPanel">
    <h1>Spielstand steuern</h1>
    <div class="teams">
      <div class="team">
        <h3>Heim</h3>
        <div class="score" id="homeControl">0</div>
        <button class="minus" onclick="changeScore('home',-1)">−</button>
        <button class="plus" onclick="changeScore('home',1)">+</button>
      </div>
      <div class="team">
        <h3>Gast</h3>
        <div class="score" id="guestControl">0</div>
        <button class="minus" onclick="changeScore('guest',-1)">−</button>
        <button class="plus" onclick="changeScore('guest',1)">+</button>
      </div>
    </div>
    <button class="reset" onclick="resetScore()">Spielstand zurücksetzen</button>
    <p id="status">Verbunden</p>
    <button class="logout" onclick="logout()">Abmelden</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDhYBRhGo3jlKSjullTBQaprgaoSPA7dXk",
  authDomain: "badminton-scoreboard-5c4b4.firebaseapp.com",
  databaseURL: "https://badminton-scoreboard-5c4b4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "badminton-scoreboard-5c4b4",
  storageBucket: "badminton-scoreboard-5c4b4.firebasestorage.app",
  messagingSenderId: "257689447899",
  appId: "1:257689447899:web:37fd7d47ff7c5e0eae4bfe"
};
const allowedUID = "NWl3lBL8XEZBiQKniVsIXiKsHB73";
const isControl = new URLSearchParams(location.search).get("control") === "1";

if (isControl) {
  document.getElementById("display").style.display = "none";
  document.getElementById("control").style.display = "block";
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const scoreRef = db.ref("matches/badminton1");
const login = document.getElementById("login");
const controlPanel = document.getElementById("controlPanel");

function updateScore(score) {
  const home = score.home ?? 0;
  const guest = score.guest ?? 0;
  document.getElementById("homeDisplay").textContent = home;
  document.getElementById("guestDisplay").textContent = guest;
  document.getElementById("homeControl").textContent = home;
  document.getElementById("guestControl").textContent = guest;
}

if (!isControl) {
  scoreRef.on("value", snapshot => updateScore(snapshot.val() || {home: 0, guest: 0}));
}

if (isControl) {
  auth.onAuthStateChanged(async user => {
    if (user && user.uid === allowedUID) {
      login.style.display = "none";
      controlPanel.style.display = "block";
      document.getElementById("status").textContent = "Verbunden";
      const snapshot = await scoreRef.once("value");
      if (!snapshot.exists()) await scoreRef.set({home: 0, guest: 0});
      scoreRef.on("value", snapshot => updateScore(snapshot.val() || {home: 0, guest: 0}));
    } else {
      if (user) await auth.signOut();
      login.style.display = "block";
      controlPanel.style.display = "none";
    }
  });

  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    document.getElementById("error").textContent = "Anmeldung läuft ...";
    try {
      const result = await auth.signInWithEmailAndPassword(email, password);
      if (result.user.uid !== allowedUID) {
        await auth.signOut();
        throw new Error("Dieses Konto hat keinen Zugriff.");
      }
      document.getElementById("error").textContent = "";
    } catch (error) {
      document.getElementById("error").textContent = "Anmeldung fehlgeschlagen: " + error.message;
    }
  });
}

function changeScore(team, amount) {
  if (!isControl || !auth.currentUser || auth.currentUser.uid !== allowedUID) return;
  scoreRef.child(team).transaction(current => Math.max(0, (current || 0) + amount));
}
function resetScore() {
  if (!isControl || !auth.currentUser || auth.currentUser.uid !== allowedUID) return;
  if (confirm("Spielstand wirklich zurücksetzen?")) scoreRef.set({home: 0, guest: 0});
}
function logout() {
  scoreRef.off();
  auth.signOut();
}
</script>
</body>
</html>
