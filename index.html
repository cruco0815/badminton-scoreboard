
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071525">

<title>SG Brietlingen-Adendorf | Badminton Live Score</title>

<style>

/* =====================================================
   1. GRUNDEINSTELLUNGEN
===================================================== */

:root {
  --cyan: #35c9e8;
  --cyan-light: #83edff;
  --navy: #071525;
  --navy-light: #10263b;
  --panel: #142b40;
  --white: #ffffff;
  --muted: #a9bacb;
  --red: #e9273d;
  --green: #39d69a;
  --border: rgba(53, 201, 232, 0.65);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: transparent;
}

button,
input {
  font-family: inherit;
}

/* =====================================================
   2. ÖFFENTLICHES SCOREBOARD
===================================================== */

#display {
  display: block;
  width: 100%;
  padding: 8px;
  background: transparent;
}

.scoreboard {
  position: relative;

  display: grid;

  grid-template-columns:
    auto
    minmax(0, 1fr)
    auto
    minmax(0, 1fr)
    auto;

  align-items: center;
  gap: clamp(12px, 1.7vw, 25px);

  width: 100%;
  max-width: 1500px;
  min-height: 105px;

  margin: 0 auto;
  padding: 15px 23px;

  color: var(--white);

  background:
    linear-gradient(
      105deg,
      rgba(4, 15, 29, 0.98),
      rgba(12, 35, 55, 0.98),
      rgba(4, 15, 29, 0.98)
    );

  border: 2px solid var(--border);
  border-radius: 38px;

  box-shadow:
    0 0 12px rgba(53, 201, 232, 0.25),
    0 0 28px rgba(53, 201, 232, 0.12),
    inset 0 0 20px rgba(53, 201, 232, 0.06);

  overflow: hidden;
}

/* Oberer Lichtstreifen */

.scoreboard::before {
  content: "";

  position: absolute;
  top: 0;
  left: 9%;

  width: 82%;
  height: 3px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      var(--cyan-light),
      var(--cyan),
      transparent
    );

  box-shadow: 0 0 12px var(--cyan);
}

/* Kleine Lichtakzente */

.scoreboard::after {
  content: "";

  position: absolute;
  bottom: 0;
  left: 18%;

  width: 64%;
  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(53, 201, 232, 0.5),
      transparent
    );
}

/* =====================================================
   3. LIVE ANZEIGE
===================================================== */

.live {
  position: relative;
  z-index: 2;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;

  padding: 8px 13px;

  color: white;
  background: var(--red);

  border-radius: 7px;

  font-size: clamp(12px, 1.3vw, 18px);
  font-weight: 900;
  letter-spacing: 1px;

  white-space: nowrap;

  box-shadow:
    0 0 12px rgba(233, 39, 61, 0.25);
}

.live-dot {
  width: 10px;
  height: 10px;

  flex-shrink: 0;

  background: white;
  border-radius: 50%;

  animation: livePulse 1.5s infinite;
}

@keyframes livePulse {
  0%, 100% {
    opacity: 1;
    box-shadow: 0 0 5px white;
  }

  50% {
    opacity: 0.4;
    box-shadow: none;
  }
}

/* =====================================================
   4. MANNSCHAFTSNAMEN
===================================================== */

.team {
  min-width: 0;

  color: white;

  font-size: clamp(15px, 2vw, 27px);
  font-weight: 900;
  letter-spacing: 0.1px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  text-shadow:
    0 2px 5px rgba(0, 0, 0, 0.35);

  padding: 8px 5px;
}

.home-team {
  text-align: center;
}

.guest-team {
  text-align: center;
}

/* Dezente Linie unter den Mannschaftsnamen */

.team::after {
  content: "";

  display: block;

  width: 100%;
  height: 2px;

  margin-top: 7px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--cyan),
      transparent
    );

  opacity: 0.65;
}

/* =====================================================
   5. SPIELSTAND
===================================================== */

.score-area {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: clamp(8px, 1vw, 14px);

  position: relative;
  z-index: 1;
}

.score {
  display: flex;
  align-items: center;
  justify-content: center;

  width: clamp(58px, 7vw, 91px);
  height: clamp(58px, 7vw, 78px);

  color: #101d2c;
  background:
    linear-gradient(
      145deg,
      #ffffff,
      #e9f4fa
    );

  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 14px;

  font-size: clamp(36px, 5vw, 65px);
  font-weight: 900;
  line-height: 1;

  font-variant-numeric: tabular-nums;

  box-shadow:
    0 4px 10px rgba(0, 0, 0, 0.28),
    inset 0 1px 2px rgba(255,255,255,0.8);
}

.separator {
  color: var(--cyan);

  font-size: clamp(28px, 4vw, 46px);
  font-weight: 900;

  text-shadow:
    0 0 10px rgba(53, 201, 232, 0.35);
}

/* Animation bei Punkteänderung */

.score.changed {
  animation: scorePop 0.45s ease;
}

@keyframes scorePop {
  0% {
    transform: scale(1);
  }

  45% {
    transform: scale(1.14);
    box-shadow:
      0 0 18px rgba(53, 201, 232, 0.7);
  }

  100% {
    transform: scale(1);
  }
}

/* =====================================================
   6. FEDERBALL
===================================================== */

.shuttlecock {
  position: relative;
  z-index: 2;

  display: block;

  width: clamp(38px, 4.2vw, 61px);
  height: clamp(38px, 4.2vw, 61px);

  overflow: visible;

  opacity: 1;

  filter:
    drop-shadow(0 0 5px rgba(53, 201, 232, 0.65))
    drop-shadow(0 0 10px rgba(53, 201, 232, 0.25));
}

/* =====================================================
   7. RESPONSIVE SCOREBOARD
===================================================== */

@media (max-width: 800px) {

  .scoreboard {
    gap: 10px;
    padding: 13px 14px;
    min-height: 90px;
  }

  .team {
    font-size: clamp(12px, 2vw, 18px);
  }

  .score {
    width: 55px;
    height: 56px;
    font-size: 38px;
  }

  .shuttlecock {
    width: 38px;
    height: 38px;
  }
}

@media (max-width: 600px) {

  #display {
    padding: 5px;
  }

  .scoreboard {
    grid-template-columns:
      auto
      minmax(0, 1fr)
      auto;

    gap: 6px;

    padding: 11px 9px;

    border-radius: 19px;
    min-height: 0;
  }

  .live {
    grid-column: 1;
    grid-row: 1;

    padding: 5px 7px;
    font-size: 9px;
  }

  .home-team {
    grid-column: 2;
    grid-row: 1;
  }

  .score-area {
    grid-column: 1 / 4;
    grid-row: 2;

    padding: 7px 0;
    gap: 9px;
  }

  .guest-team {
    grid-column: 2;
    grid-row: 3;
  }

  .shuttlecock {
    grid-column: 3;
    grid-row: 1;

    width: 27px;
    height: 27px;
  }

  .team {
    font-size: clamp(11px, 3vw, 15px);
    white-space: normal;
    line-height: 1.2;
    padding: 3px;
  }

  .team::after {
    margin-top: 4px;
  }

  .score {
    width: 52px;
    height: 47px;

    font-size: 34px;
    border-radius: 9px;
  }

  .separator {
    font-size: 27px;
  }
}

/* =====================================================
   8. ADMIN BEREICH
===================================================== */

#control {
  display: none;

  min-height: 100vh;
  padding: 20px;

  color: white;
  background:
    radial-gradient(
      circle at top,
      #18344c,
      #0d1724 65%
    );

  text-align: center;
}

.card {
  width: 100%;
  max-width: 650px;

  margin: 30px auto;
  padding: 25px;

  background:
    linear-gradient(
      145deg,
      #172d43,
      #102235
    );

  border: 1px solid #294b66;
  border-radius: 16px;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.25);
}

.card h1 {
  margin-top: 5px;
  margin-bottom: 8px;
}

.card p {
  color: var(--muted);
}

/* =====================================================
   9. LOGIN UND EINGABEN
===================================================== */

input {
  display: block;

  width: 100%;
  padding: 14px;
  margin: 10px 0;

  color: #142233;
  background: white;

  border: 1px solid #9baabb;
  border-radius: 9px;

  font-size: 16px;
}

input:focus {
  outline: 2px solid var(--cyan);
  border-color: var(--cyan);
}

button {
  padding: 12px 20px;
  margin: 5px;

  color: white;
  background:
    linear-gradient(
      135deg,
      #1686c9,
      #0872b4
    );

  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 9px;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    filter 0.15s ease;
}

button:hover {
  filter: brightness(1.13);
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.minus,
.logout {
  background: #35485d;
}

.reset {
  background: #a83240;
}

/* =====================================================
   10. STEUERUNG DER MANNSCHAFTEN
===================================================== */

.teams-control {
  display: flex;
  gap: 15px;
}

.team-control {
  flex: 1;
  min-width: 0;

  padding: 12px 5px;

  background: #101d2c;

  border: 1px solid #29445c;
  border-radius: 12px;
}

.team-control h3 {
  min-height: 38px;
  font-size: 15px;
}

.control-score {
  margin: 15px 0;

  color: white;

  font-size: 52px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}

.section-title {
  margin-top: 28px;
  margin-bottom: 10px;

  color: var(--cyan);

  text-align: left;
  font-size: 16px;
  font-weight: bold;
}

#error {
  color: #ff8c8c;
}

#status {
  color: var(--muted);
  font-size: 13px;
}

#opponentStatus {
  font-size: 13px;
  color: var(--green);
}

/* Control-Panel erst nach erfolgreichem Login zeigen */

#controlPanel {
  display: none;
}

/* =====================================================
   11. MOBILE STEUERUNG
===================================================== */

@media (max-width: 480px) {

  #control {
    padding: 8px;
  }

  .card {
    padding: 14px;
    margin: 15px auto;
  }

  .team-control h3 {
    font-size: 12px;
  }

  .control-score {
    font-size: 42px;
  }

  button {
    padding: 11px 13px;
    font-size: 15px;
  }
}

</style>
</head>

<body>

<!-- =====================================================
     ÖFFENTLICHES SCOREBOARD
===================================================== -->

<div id="display">

  <div class="scoreboard">

    <!-- LIVE -->

    <div class="live">
      <span class="live-dot"></span>
      LIVE
    </div>

    <!-- HEIMMANNSCHAFT -->

    <div class="team home-team">
      SG Brietlingen-Adendorf
    </div>

    <!-- SPIELSTAND -->

    <div class="score-area">

      <div class="score" id="homeDisplay">0</div>

      <div class="separator">:</div>

      <div class="score" id="guestDisplay">0</div>

    </div>

    <!-- GASTMANNSCHAFT -->

    <div class="team guest-team" id="opponentDisplay">
      Gegner
    </div>

    <!-- FEDERBALL -->

    <svg
      class="shuttlecock"
      viewBox="0 0 100 100"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      aria-label="Badminton Federball"
      role="img"
    >

      <!-- Federn -->

      <g
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path d="M50 69 L13 17"/>
        <path d="M50 69 L31 8"/>
        <path d="M50 69 L50 5"/>
        <path d="M50 69 L69 8"/>
        <path d="M50 69 L87 17"/>

        <path d="M13 17 Q50 -8 87 17"/>

      </g>

      <!-- Cyanfarbener Federrand -->

      <path
        d="M13 17 L31 8 L50 5 L69 8 L87 17"
        stroke="#35c9e8"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
      />

      <!-- Korkkopf -->

      <path
        d="M39 65 Q50 58 61 65 L57 91 Q50 99 43 91 Z"
        fill="#ffffff"
        stroke="#35c9e8"
        stroke-width="3"
      />

      <!-- Detail am Kork -->

      <path
        d="M43 72 L57 72"
        stroke="#35c9e8"
        stroke-width="2"
        stroke-linecap="round"
      />

    </svg>

  </div>

</div>


<!-- =====================================================
     ADMIN STEUERUNG
===================================================== -->

<div id="control">

  <!-- LOGIN -->

  <div id="login" class="card">

    <h1>🏸 Scoreboard Login</h1>

    <p>SG Brietlingen-Adendorf</p>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="E-Mail-Adresse"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Passwort"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Anmelden
      </button>

    </form>

    <p id="error"></p>

  </div>


  <!-- STEUERUNG NACH LOGIN -->

  <div id="controlPanel" class="card">

    <h1>Spielstandssteuerung</h1>

    <p>SG Brietlingen-Adendorf</p>


    <!-- GEGNERNAMEN -->

    <div class="section-title">
      Gegnerische Mannschaft
    </div>

    <input
      id="opponentInput"
      type="text"
      placeholder="Name der gegnerischen Mannschaft"
      maxlength="60"
    >

    <button onclick="saveOpponent()">
      Gegnernamen speichern
    </button>

    <p id="opponentStatus"></p>


    <!-- SPIELSTÄNDE -->

    <div class="section-title">
      Mannschaftsspielstand
    </div>

    <div class="teams-control">

      <!-- HEIM -->

      <div class="team-control">

        <h3>SG Brietlingen-Adendorf</h3>

        <div class="control-score" id="homeControl">
          0
        </div>

        <button
          class="minus"
          onclick="changeScore('home', -1)"
          aria-label="Punkt abziehen"
        >
          −
        </button>

        <button
          onclick="changeScore('home', 1)"
          aria-label="Punkt hinzufügen"
        >
          +
        </button>

      </div>


      <!-- GAST -->

      <div class="team-control">

        <h3 id="opponentControlName">
          Gegner
        </h3>

        <div class="control-score" id="guestControl">
          0
        </div>

        <button
          class="minus"
          onclick="changeScore('guest', -1)"
          aria-label="Punkt abziehen"
        >
          −
        </button>

        <button
          onclick="changeScore('guest', 1)"
          aria-label="Punkt hinzufügen"
        >
          +
        </button>

      </div>

    </div>


    <!-- ZURÜCKSETZEN -->

    <br>

    <button
      class="reset"
      onclick="resetScore()"
    >
      Spielstand zurücksetzen
    </button>

    <p id="status">
      Verbinde mit Firebase ...
    </p>

    <button
      class="logout"
      onclick="logout()"
    >
      Abmelden
    </button>

  </div>

</div>


<!-- =====================================================
     FIREBASE BIBLIOTHEKEN
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =====================================================
   12. FIREBASE KONFIGURATION
===================================================== */

const firebaseConfig = {

  apiKey: "AIzaSyDhYBRhGo3jlKSjullTBQaprgaoSPA7dXk",

  authDomain:
    "badminton-scoreboard-5c4b4.firebaseapp.com",

  databaseURL:
    "https://badminton-scoreboard-5c4b4-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "badminton-scoreboard-5c4b4",

  storageBucket:
    "badminton-scoreboard-5c4b4.firebasestorage.app",

  messagingSenderId:
    "257689447899",

  appId:
    "1:257689447899:web:37fd7d47ff7c5e0eae4bfe"

};


/* Erlaubter Benutzer */

const allowedUID =
  "NWl3lBL8XEZBiQKniVsIXiKsHB73";


/* Firebase starten */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const database = firebase.database();


/* Datenbankpfad */

const scoreRef =
  database.ref("matches/badminton1");


/* =====================================================
   13. SEITE ERKENNEN
===================================================== */

const isControl =
  new URLSearchParams(location.search)
    .get("control") === "1";


const display =
  document.getElementById("display");

const control =
  document.getElementById("control");

const login =
  document.getElementById("login");

const controlPanel =
  document.getElementById("controlPanel");


/* =====================================================
   14. ZAHLENAKTUALISIERUNG
===================================================== */

function updateNumber(id, value) {

  const element =
    document.getElementById(id);

  if (!element) return;

  const newValue = String(value);

  if (element.textContent !== newValue) {

    element.textContent = newValue;

    element.classList.remove("changed");

    void element.offsetWidth;

    element.classList.add("changed");

  }

}


/* =====================================================
   15. ALLE DATEN AKTUALISIEREN
===================================================== */

function updateScore(data) {

  const home =
    Math.max(0, Number(data.home ?? 0));

  const guest =
    Math.max(0, Number(data.guest ?? 0));

  const opponent =
    String(data.opponent || "Gegner");


  /* Öffentliche Anzeige */

  updateNumber("homeDisplay", home);

  updateNumber("guestDisplay", guest);


  /* Steuerung */

  const homeControl =
    document.getElementById("homeControl");

  if (homeControl) {
    homeControl.textContent = home;
  }


  const guestControl =
    document.getElementById("guestControl");

  if (guestControl) {
    guestControl.textContent = guest;
  }


  /* Gegnername öffentlich */

  const opponentDisplay =
    document.getElementById("opponentDisplay");

  if (opponentDisplay) {
    opponentDisplay.textContent = opponent;
  }


  /* Gegnername in der Steuerung */

  const opponentControlName =
    document.getElementById("opponentControlName");

  if (opponentControlName) {
    opponentControlName.textContent = opponent;
  }


  /* Eingabefeld nicht überschreiben,
     wenn gerade darin geschrieben wird */

  const input =
    document.getElementById("opponentInput");

  if (
    input &&
    document.activeElement !== input
  ) {

    input.value = opponent;

  }

}


/* =====================================================
   16. STANDARDWERTE
===================================================== */

const defaultData = {

  home: 0,

  guest: 0,

  opponent: "Gegner"

};


/* =====================================================
   17. ÖFFENTLICHE ANZEIGE
===================================================== */

if (!isControl) {

  display.style.display = "block";

  scoreRef.on(
    "value",

    snapshot => {

      const data =
        snapshot.val() || defaultData;

      updateScore(data);

    },

    error => {

      console.error(
        "Firebase Fehler:",
        error
      );

    }

  );

}


/* =====================================================
   18. ADMIN BEREICH
===================================================== */

if (isControl) {

  /* Öffentliches Scoreboard ausblenden */

  display.style.display = "none";

  /* Steuerungsseite anzeigen */

  control.style.display = "block";


  /* Firebase Loginstatus überwachen */

  auth.onAuthStateChanged(async user => {

    if (
      user &&
      user.uid === allowedUID
    ) {

      login.style.display = "none";

      controlPanel.style.display = "block";


      const status =
        document.getElementById("status");

      status.textContent =
        "Verbunden mit Firebase";


      try {

        /* Datenbank prüfen */

        const snapshot =
          await scoreRef.once("value");


        /* Nur beim ersten Start Standardwerte setzen */

        if (!snapshot.exists()) {

          await scoreRef.set(defaultData);

        }


        /* Änderungen live überwachen */

        scoreRef.off("value");

        scoreRef.on(
          "value",

          snapshot => {

            updateScore(
              snapshot.val() || defaultData
            );

          },

          error => {

            status.textContent =
              "Datenbankfehler: " + error.message;

          }

        );


      } catch (error) {

        status.textContent =
          "Fehler: " + error.message;

      }

    } else {

      /* Nicht erlaubte Benutzer abmelden */

      if (user) {

        await auth.signOut();

      }

      login.style.display = "block";

      controlPanel.style.display = "none";

    }

  });


  /* ===================================================
     19. LOGIN
  =================================================== */

  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",

      async event => {

        event.preventDefault();

        const errorElement =
          document.getElementById("error");

        errorElement.textContent =
          "Anmeldung läuft ...";


        try {

          const email =
            document.getElementById("email").value;

          const password =
            document.getElementById("password").value;


          const result =
            await auth.signInWithEmailAndPassword(
              email,
              password
            );


          /* UID prüfen */

          if (
            result.user.uid !== allowedUID
          ) {

            await auth.signOut();

            throw new Error(
              "Kein Zugriff auf die Steuerung."
            );

          }


          errorElement.textContent = "";


        } catch (error) {

          errorElement.textContent =
            "Anmeldung fehlgeschlagen: " +
            error.message;

        }

      }

    );

}


/* =====================================================
   20. SPIELSTAND ÄNDERN
===================================================== */

function changeScore(team, amount) {

  if (
    !isControl ||
    !auth.currentUser ||
    auth.currentUser.uid !== allowedUID
  ) {

    return;

  }


  if (
    team !== "home" &&
    team !== "guest"
  ) {

    return;

  }


  scoreRef
    .child(team)
    .transaction(current => {

      const currentScore =
        Number(current || 0);

      return Math.max(
        0,
        currentScore + amount
      );

    });

}


/* =====================================================
   21. GEGNERNAMEN SPEICHERN
===================================================== */

async function saveOpponent() {

  if (
    !isControl ||
    !auth.currentUser ||
    auth.currentUser.uid !== allowedUID
  ) {

    return;

  }


  const input =
    document.getElementById("opponentInput");

  const opponent =
    input.value.trim();


  const status =
    document.getElementById("opponentStatus");


  if (!opponent) {

    status.textContent =
      "Bitte einen Mannschaftsnamen eingeben.";

    return;

  }


  try {

    await scoreRef
      .child("opponent")
      .set(opponent);


    status.textContent =
      "✓ Gegnername erfolgreich gespeichert.";


  } catch (error) {

    status.textContent =
      "Fehler: " + error.message;

  }

}


/* =====================================================
   22. SPIELSTAND ZURÜCKSETZEN
===================================================== */

function resetScore() {

  if (
    !isControl ||
    !auth.currentUser ||
    auth.currentUser.uid !== allowedUID
  ) {

    return;

  }


  const confirmed =
    confirm(
      "Möchtest du den Spielstand wirklich auf 0:0 zurücksetzen?"
    );


  if (!confirmed) return;


  scoreRef.update({

    home: 0,

    guest: 0

  });

}


/* =====================================================
   23. ABMELDEN
===================================================== */

function logout() {

  if (!isControl) return;

  scoreRef.off("value");

  auth.signOut();

}
