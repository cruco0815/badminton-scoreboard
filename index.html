
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badminton Live Scoreboard</title>

<style>
:root {
  --cyan: #35c9e8;
  --navy: #101d2c;
  --panel: #17283a;
  --white: #ffffff;
  --muted: #a9bacb;
  --red: #ed3948;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: transparent;
}

/* ==================================
   SCOREBOARD
================================== */

#display {
  width: 100%;
  padding: 8px;
  background: transparent;
}

.scoreboard {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: clamp(10px, 2vw, 28px);

  width: 100%;
  max-width: 1150px;
  margin: 0 auto;
  padding: 17px 25px 15px;

  color: var(--white);
  background: linear-gradient(
    110deg,
    #101b29,
    #1a2d40,
    #101b29
  );

  border: 1px solid rgba(53, 201, 232, 0.55);
  border-radius: 12px;

  box-shadow:
    0 4px 18px rgba(0, 0, 0, 0.25),
    0 0 12px rgba(53, 201, 232, 0.10);

  overflow: hidden;
}

/* Dezenter cyanfarbener Akzent */

.scoreboard::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;

  background: linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    transparent
  );

  opacity: 0.9;
}

/* ==================================
   LIVE
================================== */

.live {
  position: absolute;
  top: -1px;
  left: 20px;

  display: flex;
  align-items: center;
  gap: 6px;

  padding: 4px 10px;

  background: var(--red);
  color: white;

  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;

  border-radius: 0 0 5px 5px;
}

.live-dot {
  width: 7px;
  height: 7px;
  background: white;
  border-radius: 50%;

  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: 0.35;
  }
}

/* ==================================
   TEAM NAMEN
================================== */

.team {
  min-width: 0;
  padding-top: 12px;

  font-size: clamp(13px, 2vw, 25px);
  font-weight: 800;
  letter-spacing: 0.2px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.home-team {
  text-align: left;
}

.guest-team {
  text-align: right;
}

/* ==================================
   SPIELSTAND
================================== */

.score-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(9px, 1.5vw, 18px);

  padding-top: 8px;
}

.score {
  min-width: clamp(42px, 5vw, 68px);

  color: white;
  font-size: clamp(32px, 5vw, 62px);
  font-weight: 900;
  line-height: 1;
  text-align: center;

  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.separator {
  color: var(--cyan);
  font-size: clamp(25px, 3.5vw, 42px);
  font-weight: 300;
}

.score.changed {
  animation: scorePop 0.45s ease;
}

@keyframes scorePop {
  0% {
    transform: scale(1);
    color: white;
  }

  45% {
    transform: scale(1.22);
    color: var(--cyan);
  }

  100% {
    transform: scale(1);
    color: white;
  }
}

/* ==================================
   FEDERBALL ICON
================================== */

.shuttlecock {
  position: absolute;
  right: 10px;
  bottom: 8px;

  width: 19px;
  height: 19px;

  opacity: 0.35;
}

/* ==================================
   MOBILE
================================== */

@media (max-width: 650px) {
  #display {
    padding: 5px;
  }

  .scoreboard {
    gap: 7px;
    padding: 17px 9px 12px;
    border-radius: 8px;
  }

  .team {
    font-size: clamp(10px, 2.5vw, 15px);
    white-space: normal;
    line-height: 1.2;
  }

  .score-area {
    gap: 4px;
  }

  .score {
    min-width: 29px;
    font-size: clamp(25px, 6vw, 38px);
  }

  .separator {
    font-size: 23px;
  }

  .live {
    left: 10px;
    font-size: 9px;
    padding: 3px 7px;
  }
}

/* ==================================
   STEUERUNG
================================== */

#control {
  display: none;
  min-height: 100vh;
  padding: 20px;

  color: white;
  background: #0d1724;
  text-align: center;
}

.card {
  width: 100%;
  max-width: 650px;
  margin: 30px auto;
  padding: 25px;

  background: #17283a;
  border: 1px solid #29445c;
  border-radius: 14px;
}

.card h1 {
  margin-top: 5px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 9px 0;

  color: #142233;
  background: white;

  border: 1px solid #9baabb;
  border-radius: 8px;

  font-size: 16px;
}

button {
  padding: 12px 20px;
  margin: 5px;

  color: white;
  background: #1686c9;

  border: none;
  border-radius: 8px;

  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

.minus,
.logout {
  background: #35485d;
}

.reset {
  background: #a83240;
}

.teams-control {
  display: flex;
  gap: 15px;
}

.team-control {
  flex: 1;
  min-width: 0;
  padding: 12px 5px;

  background: #101d2c;
  border: 1px solid #29445c;
  border-radius: 10px;
}

.team-control h3 {
  min-height: 38px;
  font-size: 15px;
}

.control-score {
  margin: 15px 0;
  font-size: 52px;
  font-weight: 900;
}

.section-title {
  margin-top: 28px;
  margin-bottom: 10px;
  text-align: left;
  font-size: 16px;
  color: var(--cyan);
}

#error {
  color: #ff8c8c;
}

#status {
  color: #a9bacb;
  font-size: 13px;
}

@media (max-width: 480px) {
  #control {
    padding: 8px;
  }

  .card {
    padding: 14px;
  }

  .team-control h3 {
    font-size: 12px;
  }

  .control-score {
    font-size: 42px;
  }

  button {
    padding: 11px 13px;
    font-size: 15px;
  }
}
</style>
</head>

<body>

<!-- ==================================
     ÖFFENTLICHES SCOREBOARD
================================== -->

<div id="display">

  <div class="scoreboard">

    <div class="live">
      <span class="live-dot"></span>
      LIVE
    </div>

    <div class="team home-team">
      SG Brietlingen-Adendorf
    </div>

    <div class="score-area">
      <div class="score" id="homeDisplay">0</div>
      <div class="separator">:</div>
      <div class="score" id="guestDisplay">0</div>
    </div>

    <div class="team guest-team" id="opponentDisplay">
      Gegner
    </div>

    <svg class="shuttlecock"
         viewBox="0 0 100 100"
         fill="none"
         stroke="#35c9e8"
         stroke-width="6"
         stroke-linecap="round">

      <path d="M50 72 L20 25"/>
      <path d="M50 72 L35 12"/>
      <path d="M50 72 L50 8"/>
      <path d="M50 72 L65 12"/>
      <path d="M50 72 L80 25"/>
      <path d="M20 25 Q50 0 80 25"/>

      <path d="M38 70 Q50 60 62 70 L58 92 Q50 100 42 92 Z"
            fill="#35c9e8"
            stroke="none"/>

    </svg>

  </div>

</div>


<!-- ==================================
     ADMIN STEUERUNG
================================== -->

<div id="control">

  <div id="login" class="card">

    <h1>🏸 Scoreboard Login</h1>

    <p>SG Brietlingen-Adendorf</p>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="E-Mail-Adresse"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Passwort"
        autocomplete="current-password"
        required
      >

      <button type="submit">Anmelden</button>

    </form>

    <p id="error"></p>

  </div>


  <div id="controlPanel" class="card">

    <h1>Spielstandssteuerung</h1>

    <p>SG Brietlingen-Adendorf</p>

    <!-- Gegnername ändern -->

    <div class="section-title">
      Gegnerische Mannschaft
    </div>

    <input
      id="opponentInput"
      type="text"
      placeholder="Name der gegnerischen Mannschaft"
      maxlength="60"
    >

    <button onclick="saveOpponent()">
      Gegnernamen speichern
    </button>

    <p id="opponentStatus"></p>


    <!-- Spielstände -->

    <div class="section-title">
      Mannschaftsspielstand
    </div>

    <div class="teams-control">

      <div class="team-control">

        <h3>SG Brietlingen-Adendorf</h3>

        <div class="control-score" id="homeControl">
          0
        </div>

        <button class="minus"
          onclick="changeScore('home', -1)">
          −
        </button>

        <button
          onclick="changeScore('home', 1)">
          +
        </button>

      </div>


      <div class="team-control">

        <h3 id="opponentControlName">
          Gegner
        </h3>

        <div class="control-score" id="guestControl">
          0
        </div>

        <button class="minus"
          onclick="changeScore('guest', -1)">
          −
        </button>

        <button
          onclick="changeScore('guest', 1)">
          +
        </button>

      </div>

    </div>

    <br>

    <button class="reset" onclick="resetScore()">
      Spielstand zurücksetzen
    </button>

    <p id="status">Verbinde mit Firebase ...</p>

    <button class="logout" onclick="logout()">
      Abmelden
    </button>

  </div>

</div>


<!-- ==================================
     FIREBASE
================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* FIREBASE KONFIGURATION */

const firebaseConfig = {
  apiKey: "AIzaSyDhYBRhGo3jlKSjullTBQaprgaoSPA7dXk",
  authDomain: "badminton-scoreboard-5c4b4.firebaseapp.com",
  databaseURL: "https://badminton-scoreboard-5c4b4-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "badminton-scoreboard-5c4b4",
  storageBucket: "badminton-scoreboard-5c4b4.firebasestorage.app",
  messagingSenderId: "257689447899",
  appId: "1:257689447899:web:37fd7d47ff7c5e0eae4bfe"
};

const allowedUID = "NWl3lBL8XEZBiQKniVsIXiKsHB73";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const database = firebase.database();

const scoreRef =
  database.ref("matches/badminton1");


/* SEITE ERKENNEN */

const isControl =
  new URLSearchParams(location.search).get("control") === "1";

const display = document.getElementById("display");
const control = document.getElementById("control");
const login = document.getElementById("login");
const controlPanel = document.getElementById("controlPanel");


/* NAMEN UND SPIELSTÄNDE AKTUALISIEREN */

function updateScore(data) {

  const home = Number(data.home ?? 0);
  const guest = Number(data.guest ?? 0);
  const opponent = String(data.opponent || "Gegner");

  updateNumber("homeDisplay", home);
  updateNumber("guestDisplay", guest);

  document.getElementById("homeControl").textContent = home;
  document.getElementById("guestControl").textContent = guest;

  document.getElementById("opponentDisplay").textContent =
    opponent;

  document.getElementById("opponentControlName").textContent =
    opponent;

  const input = document.getElementById("opponentInput");

  if (document.activeElement !== input) {
    input.value = opponent;
  }
}


/* ZAHLENANIMATION */

function updateNumber(id, value) {

  const element = document.getElementById(id);

  if (element.textContent !== String(value)) {

    element.textContent = value;

    element.classList.remove("changed");

    void element.offsetWidth;

    element.classList.add("changed");

  }
}


/* ÖFFENTLICHE ANZEIGE */

if (!isControl) {

  scoreRef.on("value", snapshot => {

    updateScore(
      snapshot.val() || {
        home: 0,
        guest: 0,
        opponent: "Gegner"
      }
    );

  }, error => {
    console.error("Firebase:", error);
  });

}


/* ADMIN BEREICH */

if (isControl) {

  display.style.display = "none";
  control.style.display = "block";

  auth.onAuthStateChanged(async user => {

    if (user && user.uid === allowedUID) {

      login.style.display = "none";
      controlPanel.style.display = "block";

      document.getElementById("status").textContent =
        "Verbunden mit Firebase";

      try {

        const snapshot = await scoreRef.once("value");

        if (!snapshot.exists()) {

          await scoreRef.set({
            home: 0,
            guest: 0,
            opponent: "Gegner"
          });

        }

        scoreRef.on("value", snapshot => {

          updateScore(
            snapshot.val() || {
              home: 0,
              guest: 0,
              opponent: "Gegner"
            }
          );

        });

      } catch (error) {

        document.getElementById("status").textContent =
          "Fehler: " + error.message;

      }

    } else {

      if (user) await auth.signOut();

      login.style.display = "block";
      controlPanel.style.display = "none";

    }

  });


  /* LOGIN */

  document.getElementById("loginForm")
    .addEventListener("submit", async event => {

      event.preventDefault();

      const errorElement =
        document.getElementById("error");

      errorElement.textContent = "Anmeldung läuft ...";

      try {

        const result =
          await auth.signInWithEmailAndPassword(
            document.getElementById("email").value,
            document.getElementById("password").value
          );

        if (result.user.uid !== allowedUID) {

          await auth.signOut();

          throw new Error("Kein Zugriff auf die Steuerung.");

        }

        errorElement.textContent = "";

      } catch (error) {

        errorElement.textContent =
          "Anmeldung fehlgeschlagen: " + error.message;

      }

    });

}


/* SPIELSTAND ÄNDERN */

function changeScore(team, amount) {

  if (
    !isControl ||
    !auth.currentUser ||
    auth.currentUser.uid !== allowedUID
  ) return;

  scoreRef.child(team).transaction(current => {

    return Math.max(0, Number(current || 0) + amount);

  });

}


/* GEGNERNAMEN SPEICHERN */

async function saveOpponent() {

  if (
    !isControl ||
    !auth.currentUser ||
    auth.currentUser.uid !== allowedUID
  ) return;

  const input =
    document.getElementById("opponentInput");

  const opponent = input.value.trim();

  const status =
    document.getElementById("opponentStatus");

  if (!opponent) {

    status.textContent = "Bitte einen Namen eingeben.";
    return;

  }

  try {

    await scoreRef.child("opponent").set(opponent);

    status.textContent =
      "Gegnername erfolgreich gespeichert.";

  } catch (error) {

    status.textContent =
      "Fehler beim Speichern: " + error.message;

  }

}


/* SPIELSTAND ZURÜCKSETZEN */

function resetScore() {

  if (
    !isControl ||
    !auth.currentUser ||
    auth.currentUser.uid !== allowedUID
  ) return;

  if (confirm("Spielstand wirklich zurücksetzen?")) {

    scoreRef.update({
      home: 0,
      guest: 0
    });

  }

}


/* ABMELDEN */

function logout() {

  scoreRef.off();
  auth.signOut();

}

</script>

</body>
</html>
